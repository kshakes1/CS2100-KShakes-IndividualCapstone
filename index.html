<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokeboxes</title>
</head>

<body>
        
    <div id="wrapper">

        <header>

            <button data-screen="hero"><img src="pokebox.png" alt="go to home screen"></button>

        </header>    

        <section id="hero" class="screen">

            <img src="gimmighoulhero.png" alt="gimmighoul hero">

            <p>Welcome to Pokeboxes!</p>

        </section>

        <nav id="selector">

            <ul>

                <li><button data-screen="collection-screen">Collection</button></li>
                <li><button data-screen="open-box-screen">Open Boxes</button></li>
                <li><button data-screen="library-screen">Library</button></li>

            </ul>

        </nav>

        <main>

            <section id="open-box-screen" class="hide screen">

                <h1>Open A Box!</h1>

                <div id="lootbox"> ? </div>

                <button id="open-box-button">Open Box</button>

                <div id="result-card">

                    <img src="" alt="" id="result-card-photo">

                    <div id="pokemon-stats">
                        <p>Pokemon: <span id="pokemon-name"></span></p>
                        <p>Dex ID#: <span id="pokedex-id"></span></p>
                        <p>Type(s): <span id="pokemon-type"></span></p>
                        <p>Shiny: <span id="shiny-value"></span></p>
                    </div>

                </div>

            </section>

            <section id="collection-screen" class="hide screen">

                <h1>Collection</h1>

            </section>

            <section id="library-screen" class="hide screen">

                <h1>Library</h1>

            </section>

        </main>

    </div>

    

    <script src="scripts.js"></script>
        
</body>

</html>
